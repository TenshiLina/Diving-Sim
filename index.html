<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reef Aquarium</title>
    <style>
      :root {
        --panel-bg: rgba(4, 28, 38, 0.55);
        --panel-border: rgba(160, 230, 240, 0.18);
        --text: #e6fbff;
        --muted: #9fcbd4;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06303f;
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        left: 16px;
        top: 16px;
        max-width: calc(100vw - 32px);
        pointer-events: none;
      }
      .panel {
        pointer-events: auto;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 10px;
        padding: 12px 14px;
        width: 260px;
        max-width: 100%;
        box-sizing: border-box;
      }
      .title {
        font-weight: 650;
        letter-spacing: 0.02em;
        font-size: 16px;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
        font-style: italic;
      }
      .pick {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .pick select {
        flex: 1;
        min-width: 0;
        background: rgba(0, 20, 28, 0.6);
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 4px 6px;
        font: inherit;
        font-size: 13px;
      }
      .hint {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      #error {
        position: fixed;
        bottom: 16px;
        left: 16px;
        right: 16px;
        color: #ffb4a8;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="error"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
