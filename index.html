<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reef Aquarium</title>
    <style>
      :root {
        --panel-bg: rgba(4, 28, 38, 0.55);
        --panel-border: rgba(160, 230, 240, 0.18);
        --text: #e6fbff;
        --muted: #9fcbd4;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06303f;
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        left: 16px;
        top: 16px;
        max-width: calc(100vw - 32px);
        pointer-events: none;
      }
      .panel {
        pointer-events: auto;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 10px;
        padding: 12px 14px;
        width: 260px;
        max-width: 100%;
        box-sizing: border-box;
      }
      .title {
        font-weight: 650;
        letter-spacing: 0.02em;
        font-size: 16px;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
        font-style: italic;
      }
      .pick {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .pick select {
        flex: 1;
        min-width: 0;
        background: rgba(0, 20, 28, 0.6);
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 4px 6px;
        font: inherit;
        font-size: 13px;
      }
      .hint {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      #error {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        max-height: 50vh;
        overflow: auto;
        background: rgba(40, 8, 8, 0.85);
        border: 1px solid rgba(255, 150, 140, 0.4);
        border-radius: 10px;
        padding: 10px 12px;
        color: #ffd6d0;
        font-size: 13px;
      }
      #error pre {
        margin: 6px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        color: #ffb4a8;
      }
      .err-item + .err-item {
        margin-top: 10px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="loading">Loading the reef…</div>
    <div id="error" hidden></div>
    <noscript><div id="loading">The aquarium needs JavaScript turned on.</div></noscript>
    <script>
      // Watchdog: if the app bundle never starts (blocked, failed to download,
      // unsupported syntax), say so instead of leaving a blank page.
      setTimeout(function () {
        if (window.__reefStarted) return;
        var l = document.getElementById('loading');
        if (l) l.textContent = 'The aquarium did not start. Try reloading; if it keeps happening, please report your device and browser.';
      }, 20000);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
